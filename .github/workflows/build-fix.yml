name: Site Integrity

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify required site files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          test -f assets/shared-layout.js
          test -f assets/images/djpcd-logo.svg
          test -f pages/services.html
          test -f pages/blog.html
          test -f pages/faq.html

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check assets/shared-layout.js
          node --check assets/router.js
