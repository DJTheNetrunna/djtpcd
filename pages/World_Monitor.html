<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>World Monitor | DJ The PC Dude</title>
  <meta name="description" content="Live technology-focused world monitoring map from DJ The PC Dude." />
  <link rel="canonical" href="https://djthepcdude.com/pages/World_Monitor.html" />
  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-tr from-gray-900 to-black text-white font-mono min-h-screen">
  <header></header>

  <main class="space-y-6">
    <section class="fade-in-up">
      <p class="hero-eyebrow">Live Data</p>
      <h1 class="text-3xl md:text-4xl font-black mb-3">World Monitor</h1>
      <p>Live global monitoring view with earthquake data and a dark technical map interface.</p>
    </section>

    <section class="fade-in-up card p-3 md:p-5">
      <iframe
        src="https://tech.worldmonitor.app/embed?layers=earthquakes&amp;center=20%2C-121.166&amp;zoom=1&amp;theme=dark&amp;variant=tech"
        title="World Monitor live map"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        style="width:100%;height:min(72vh,720px);min-height:480px;border:0;display:block;border-radius:10px"
        allowfullscreen>
      </iframe>
    </section>
  </main>

  <footer></footer>
  <script src="/assets/shared-layout.js" defer></script>
</body>
</html>
