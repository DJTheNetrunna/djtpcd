<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GitHub Projects | DJ The PC Dude</title>
  <meta name="description" content="Browse open-source projects, PC tools, web experiments, Linux utilities, and other GitHub work from DJ The PC Dude." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://djthepcdude.com/pages/github.html" />
  <link rel="icon" type="image/svg+xml" href="/assets/images/djpcd-logo.svg" />
  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-tr from-gray-900 to-black text-white min-h-screen font-mono">
  <header></header>

  <main class="space-y-8">
    <section class="fade-in-up">
      <span class="hero-eyebrow">Code • Tools • Experiments</span>
      <div class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
        <div>
          <h1 class="text-3xl font-black tracking-tight md:text-5xl">GitHub Projects</h1>
          <p class="mt-3 max-w-3xl text-gray-400">
            Public projects, PC utilities, Linux tools, web experiments, automation, and open-source work from DJ The PC Dude.
          </p>
        </div>
        <a
          href="https://github.com/DJTheNetrunna"
          target="_blank"
          rel="noopener noreferrer"
          class="hero-cta shrink-0"
        >
          Open GitHub Profile ↗
        </a>
      </div>
    </section>

    <section class="fade-in-up card p-4 md:p-5" aria-label="Repository controls">
      <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
        <div>
          <h2 class="text-xl font-bold">Public Repository Feed</h2>
          <p class="mt-1 text-sm text-gray-400">Sorted by most recently updated.</p>
        </div>
        <label class="md:w-72">
          <span class="sr-only">Filter repositories</span>
          <input id="repo-filter" type="search" placeholder="Filter projects…" autocomplete="off" />
        </label>
      </div>
    </section>

    <section aria-live="polite">
      <div id="repo-status" class="mb-4 text-sm text-gray-400">Loading repositories…</div>
      <div id="repo-list" class="grid gap-5 md:grid-cols-2 lg:grid-cols-3"></div>
    </section>
  </main>

  <footer></footer>

  <script src="/assets/shared-layout.js" defer></script>
  <script>
    (() => {
      const username = "DJTheNetrunna";
      const apiUrl = `https://api.github.com/users/${username}/repos?sort=updated&per_page=100&type=owner`;
      const list = document.getElementById("repo-list");
      const status = document.getElementById("repo-status");
      const filter = document.getElementById("repo-filter");
      let repos = [];

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function render(items) {
        list.innerHTML = "";

        if (!items.length) {
          status.textContent = "No matching public repositories found.";
          return;
        }

        status.textContent = `${items.length} public project${items.length === 1 ? "" : "s"}`;

        items.forEach((repo) => {
          const card = document.createElement("article");
          card.className = "card p-5 flex flex-col";

          const name = escapeHtml(repo.name || "Untitled");
          const desc = escapeHtml(repo.description || "No description yet.");
          const language = escapeHtml(repo.language || "Mixed / N/A");
          const stars = Number(repo.stargazers_count || 0);
          const forks = Number(repo.forks_count || 0);
          const url = repo.html_url || `https://github.com/${username}`;
          const archived = repo.archived ? '<span class="rounded bg-yellow-500/10 px-2 py-1 text-xs text-yellow-300">Archived</span>' : "";

          card.innerHTML = `
            <div class="mb-3 flex items-start justify-between gap-3">
              <h2 class="break-words text-lg font-bold text-cyan-300">${name}</h2>
              ${archived}
            </div>
            <p class="mb-4 flex-1 text-sm leading-6 text-gray-400">${desc}</p>
            <div class="mb-4 flex flex-wrap gap-2 text-xs text-gray-400">
              <span class="rounded border border-cyan-400/20 px-2 py-1">${language}</span>
              <span class="rounded border border-cyan-400/20 px-2 py-1">★ ${stars}</span>
              <span class="rounded border border-cyan-400/20 px-2 py-1">Forks ${forks}</span>
            </div>
            <a href="${url}" target="_blank" rel="noopener noreferrer" class="font-bold text-cyan-400 hover:text-cyan-200">
              View repository →
            </a>
          `;

          list.appendChild(card);
        });
      }

      fetch(apiUrl, { headers: { Accept: "application/vnd.github+json" } })
        .then(async (response) => {
          if (!response.ok) throw new Error(`GitHub API returned ${response.status}`);
          return response.json();
        })
        .then((data) => {
          repos = Array.isArray(data) ? data.filter((repo) => !repo.fork) : [];
          render(repos);
        })
        .catch((error) => {
          console.error(error);
          status.innerHTML = 'Could not load the live repository feed. <a class="text-cyan-400 underline" href="https://github.com/DJTheNetrunna" target="_blank" rel="noopener noreferrer">Open the GitHub profile directly.</a>';
        });

      filter.addEventListener("input", () => {
        const query = filter.value.trim().toLowerCase();
        if (!query) return render(repos);

        render(repos.filter((repo) => {
          const haystack = `${repo.name || ""} ${repo.description || ""} ${repo.language || ""}`.toLowerCase();
          return haystack.includes(query);
        }));
      });
    })();
  </script>
</body>
</html>
